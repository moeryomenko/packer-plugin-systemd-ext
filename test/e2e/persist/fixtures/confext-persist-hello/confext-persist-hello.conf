# confext-persist-hello — E2E fixture payload for the confext provisioner.
#
# The confext provisioner wraps the source directory as the etc/ subtree of
# the extension, so this file lands at /etc/confext-persist-hello.conf when
# the extension is merged. It is data (never executed): confext merges /etc
# noexec + nosuid.
SYSEXT_E2E_CONFEXT=persisted
