name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.10.1
      - name: Test
        run: go test -race -count 1 ./... -timeout=3m
      - name: Traceability gate
        run: ./scripts/check-no-traceability.sh
